    <style>
      /* Instant paint shell — visible before the JS bundle executes.
         Removed automatically as soon as React mounts into #root. */
      #app-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #0f172a;
        text-align: center;
        padding: 24px;
      }
      #app-shell .brand {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(90deg, #4f46e5, #7c3aed);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #app-shell .tag {
        font-size: 15px;
        max-width: 340px;
        line-height: 1.5;
        color: #64748b;
      }
      #app-shell .bar {
        width: 160px;
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: #e2e8f0;
      }
      #app-shell .bar span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #4f46e5, #7c3aed);
        animation: shell-slide 1.1s ease-in-out infinite;
      }
      @keyframes shell-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
      #root:not(:empty) + #app-shell { display: none; }
    </style>
  </head>

    <div id="root"></div>
    <div id="app-shell">
      <div class="brand">Career Decoder</div>
      <p class="tag">Know exactly why you're not getting interviews — ATS score, skill gaps and a roadmap.</p>
      <div class="bar"><span></span></div>
    </div>
    <noscript>
